name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

  dashboard-e2e:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deskhand/shared build
      - run: pnpm --filter @deskhand/dashboard e2e
      # Real manager in fake-runtime mode (no Docker needed).
      - run: pnpm --filter @deskhand/dashboard e2e:real
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: packages/dashboard/playwright-report

  docker-integration:
    # Builds the desktop image and runs the tests that need real containers:
    # daemon e2e (effects inside the desktop), manager Docker integration and scripted real-desktop e2e.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build desktop image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/desktop/Dockerfile
          tags: deskhand-desktop:dev
          load: true
          cache-from: type=gha,scope=desktop-amd64
          cache-to: type=gha,mode=max,scope=desktop-amd64
      # Ubuntu 23.10+ blocks unprivileged user namespaces via AppArmor, which Chromium's sandbox needs.
      # Without this the desktop falls back to --no-sandbox (docs/security.md).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm --filter @deskhand/daemon test:e2e
      - run: pnpm --filter @deskhand/manager test:docker
      - run: pnpm --filter @deskhand/manager test:e2e
        env:
          DESKHAND_E2E_IMAGE: deskhand-desktop:dev
