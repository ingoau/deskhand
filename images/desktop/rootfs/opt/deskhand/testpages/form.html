<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Contact form</title><link rel="stylesheet" href="style.css">
<style>
  form { display: grid; grid-template-columns: 160px 360px; gap: 12px 16px; align-items: center; margin-top: 16px; }
  label.f { justify-self: end; }
  input[type=text], input[type=email], select, textarea { font: inherit; padding: 6px 8px; border: 1px solid #aaa; border-radius: 4px; }
  textarea { height: 80px; }
  fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 16px; }
  .actions { grid-column: 2; }
  button { font: inherit; padding: 8px 18px; }
</style></head>
<body>
<h1>Contact form</h1>
<p class="hint">A plain HTML form for the web-form checks. Submitting goes to form-done.html, which shows (and records) what was sent.</p>
<form id="contact" action="form-done.html" method="get">
  <label class="f" for="name">Full name</label>
  <input type="text" id="name" name="name" required autocomplete="off">

  <label class="f" for="email">Email</label>
  <input type="email" id="email" name="email" required autocomplete="off">

  <label class="f" for="country">Country</label>
  <select id="country" name="country">
    <option value="">Choose…</option>
    <option value="au">Australia</option>
    <option value="de">Germany</option>
    <option value="jp">Japan</option>
    <option value="nz">New Zealand</option>
    <option value="us">United States</option>
  </select>

  <span class="f" id="plan-label" style="justify-self:end">Plan</span>
  <fieldset role="radiogroup" aria-labelledby="plan-label">
    <label><input type="radio" name="plan" value="free" checked> Free</label>
    <label><input type="radio" name="plan" value="pro"> Pro</label>
    <label><input type="radio" name="plan" value="team"> Team</label>
  </fieldset>

  <span></span>
  <label><input type="checkbox" id="newsletter" name="newsletter" value="yes"> Send me the newsletter</label>

  <label class="f" for="message">Message</label>
  <textarea id="message" name="message"></textarea>

  <div class="actions"><button type="submit" id="submit">Send message</button></div>
</form>
<div class="status" id="status"></div>
<script src="common.js"></script>
<script>
  const f = document.getElementById("contact");
  f.addEventListener("input", (e) => deskhandLog("input", e.target.name));
  f.addEventListener("submit", () => deskhandLog("submit", Object.fromEntries(new FormData(f))));
</script>
</body>
</html>
