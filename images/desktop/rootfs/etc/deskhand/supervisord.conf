; deskhand desktop processes. Start order by priority; each waits for what it needs.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:xvfb]
priority=10
user=agent
command=/usr/local/lib/deskhand/session bash -c 'exec Xvfb :0 -screen 0 ${DESKHAND_SCREEN_W}x${DESKHAND_SCREEN_H}x${DESKHAND_SCREEN_D} -dpi 96 -nolisten tcp +extension RANDR -noreset'
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dbus]
priority=20
user=agent
command=/usr/local/lib/deskhand/session bash -c 'exec dbus-daemon --session --nofork --nopidfile --address="$DBUS_SESSION_BUS_ADDRESS"'
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:atspi]
priority=30
user=agent
command=/usr/local/lib/deskhand/session --wait-x --wait-dbus /usr/libexec/at-spi-bus-launcher --launch-immediately
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
priority=40
user=agent
command=/usr/local/lib/deskhand/session --wait-x --wait-dbus bash -c 'xsetroot -solid "#2f3440" -cursor_name left_ptr; exec openbox'
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tint2]
priority=50
user=agent
command=/usr/local/lib/deskhand/session --wait-x --wait-dbus bash -c 'sleep 0.5; exec tint2 -c /etc/xdg/tint2/tint2rc'
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:x11vnc]
priority=60
user=agent
; x11vnc loops over every possible fd; with Docker's default nofile limit (~1e9) it never gets to
; accept(). Cap the limit for it.
command=/usr/local/lib/deskhand/session --wait-x bash -c 'ulimit -n 1024; exec x11vnc -display :0 -rfbport 5900 -localhost -nopw -forever -shared -noxdamage -xkb -clear_all -ncache 0 -noipv6 -quiet -norc'
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:daemon]
priority=70
user=root
command=/usr/local/lib/deskhand/session --wait-x /usr/local/bin/node --enable-source-maps /opt/deskhand/daemon/daemon.mjs
environment=HOME="/root",USER="root"
autorestart=true
startsecs=2
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
